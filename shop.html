<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop all products | MORGGY</title>
<meta name="description" content="Browse the full MORGGY range: home, electronics, travel, lifestyle, automotive and pet accessories. Prices in S$ and RM with tracked delivery.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23102B25'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23D6A85F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main>
  <div class="page-head">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Shop all</span></div>
      <h1>Shop all</h1>
      <p>The full launch range — nine products across six categories. Everything ships from a vetted supplier with tracking.</p>
    </div>
  </div>

  <div class="container section section--tight">
    <div class="shop-layout">
      <aside class="filters" id="shopFilters" aria-label="Filters"></aside>
      <div>
        <div class="shop-bar">
          <span class="result-count" id="resultCount">Loading…</span>
          <label class="result-count" for="shopSort">Sort
            <select id="shopSort" style="display:inline-block;width:auto;margin-left:8px;padding:8px 34px 8px 12px">
              <option value="featured">Featured</option>
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
        <div class="prod-grid prod-grid--3" id="shopGrid"></div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
